; Shared pattern for both app droplets' PHP-FPM pool — copy this once per
; droplet, replacing POOL_NAME (e.g. "database-final" or "central-service")
; throughout, to /etc/php/8.4/fpm/pool.d/POOL_NAME.conf. Then:
;   systemctl restart php8.4-fpm
;
; A named pool (rather than editing the default www pool) keeps each app's
; socket path and process limits independent, in case both apps ever end
; up on the same droplet.
;
; Note: '#'-style comments aren't reliably parsed by this PHP-FPM build
; (confirmed during the actual centralservice-api-server deployment — it
; failed with "value is NULL for a ZEND_INI_PARSER_ENTRY" until switched to
; ';' throughout) — use ';' consistently, matching the stock www.conf.

[POOL_NAME]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-POOL_NAME.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Small-droplet sizing (2 vCPU / 2-4GB class) — tune up if the droplet is
; bigger. pm=dynamic balances idle memory use against burst capacity better
; than pm=static for a low/moderate-traffic app like this one.
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[error_log] = /var/log/php-fpm-POOL_NAME-error.log
php_admin_flag[log_errors] = on
